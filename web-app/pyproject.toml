[project]
name = "gh200-estudos"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "Flask-WTF>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quiz*"]

[tool.setuptools.package-data]
quiz = ["templates/*.html", "static/*.css", "static/*.js"]
