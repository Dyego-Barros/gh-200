<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}GH-200 · Estudos{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><nav class="navbar border-bottom bg-white"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('index') }}">⌘ GH-200 <span class="text-secondary fw-normal">/ Estudos</span></a><span class="small text-secondary">GitHub Actions</span></div></nav><main class="container py-5">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer class="container pb-4 text-secondary small">Material de estudo autoral. O percentual de acertos não equivale à nota oficial da certificação.</footer>{% block scripts %}{% endblock %}</body></html>
